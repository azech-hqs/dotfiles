# --- Settings ---

# turn on focus-events for neovim
set -g focus-events on
set -g mode-keys vi
set -s set-clipboard on

# switch to the previous session instead of detaching when one is killed
set -g detach-on-destroy previous

# let programs write to the outer terminal directly (kitty graphics protocol,
# used by snacks.nvim image previews)
set -g allow-passthrough on

# coloured undercurls for lsp diagnostics
set -as terminal-features ',xterm*:usstyle'

# pass OSC 8 hyperlinks (eza --hyperlink, gh, …) through to the terminal;
# xterm-ghostty's terminfo has no Hls capability, so tmux needs telling
set -as terminal-features ',*:hyperlinks'

# number windows and panes from 1, and keep the numbering gapless
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# room to scroll back through `pnpm dev` / `pytest` output
set -g history-limit 50000

# `mouse on` is deliberately absent: mouse reporting makes tmux swallow clicks,
# which breaks Ghostty's cmd-click to open URLs (cmd+shift+click bypasses it)


# --- Keybinds ---

# reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# New windows and splits open in the current pane's directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Session jumping with `fzf`
bind C-j display-popup -E "~/.config/tmux/fzf-session.sh"

# Toggle between the two most recent sessions
bind Space switch-client -l

# Taskwarrior popup: `task today` plus a prompt for task commands
bind t display-popup -E -w 80% -h 60% -T " Today " "~/.config/tmux/task-popup.sh"

# zk popup: capture a note, or open an existing one
bind n display-popup -E -w 80% -h 60% -T " Notes " "~/.config/tmux/zk-popup.sh"

# Open this pane's scrollback in nvim (handy for a wall of pytest output)
bind e run-shell 'f="${TMPDIR:-/tmp}/tmux-scrollback-#{pane_id}.txt"; tmux capture-pane -p -J -S -50000 -t "#{pane_id}" > "$f"; tmux new-window -n scrollback "nvim + \"$f\""'

# Use v to trigger selection
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Use V to select current line
bind-key -T copy-mode-vi V send-keys -X select-line

# Use y to yank current selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Use C-v to toggle block (rectangle) selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Use Escape to leave copy mode
bind-key -T copy-mode-vi Escape send-keys -X cancel


# --- Theme ---
# catppuccin/tmux, pinned by .chezmoiscripts/run_once_after_install-tmux-plugins.sh.
# These are v2 option names; v2 renamed or dropped most of the v1/v0.3 ones.
set -g @catppuccin_flavor 'mocha'

# status format. v2 reads "default" as mantle, so pass the base colour
# explicitly — any other value is treated as a format string.
set -g @catppuccin_status_background "#{@thm_bg}"
set -g @catppuccin_status_connect_separator "yes"

# Window flags. The icons stay inert while @catppuccin_window_flags is "none";
# set it to "icon" to show them, or "text" for tmux's own #F flags.
set -g @catppuccin_window_flags "none"
set -g @catppuccin_window_flags_icon_last "󰖰 "
set -g @catppuccin_window_flags_icon_current "󰖯 "
set -g @catppuccin_window_flags_icon_zoom "󰁌 "
set -g @catppuccin_window_flags_icon_mark "󰃀 "
set -g @catppuccin_window_flags_icon_silent "󰂛 "
set -g @catppuccin_window_flags_icon_activity "󱅫 "
set -g @catppuccin_window_flags_icon_bell "󰂞 "

# windows
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_number_position "left"

# Window colours. v2 dropped the "fill" options; colour the number and text
# blocks directly instead.
set -g @catppuccin_window_number_color "#{@thm_overlay_2}"
set -g @catppuccin_window_text_color "#{@thm_surface_0}"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"
set -g @catppuccin_window_current_text_color "#{@thm_surface_1}"

# Window separators. Under "custom" these are emitted verbatim, so each carries
# its own colours: a solid block on the status background, then the style for
# the segment that follows it.
set -g @catppuccin_window_left_separator "#[fg=#{@thm_overlay_2},bg=default]█#[fg=#{@thm_crust},bg=#{@thm_overlay_2}]"
set -g @catppuccin_window_middle_separator "#[fg=#{@thm_overlay_2},bg=#{@thm_surface_0}]█ "
set -g @catppuccin_window_right_separator "#[fg=#{@thm_surface_0},bg=default]█"
set -g @catppuccin_window_current_left_separator "#[fg=#{@thm_peach},bg=default]█#[fg=#{@thm_crust},bg=#{@thm_peach}]"
set -g @catppuccin_window_current_middle_separator "#[fg=#{@thm_peach},bg=#{@thm_surface_1}]█ "
set -g @catppuccin_window_current_right_separator "#[fg=#{@thm_surface_1},bg=default]█"

# window default format
set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_text "#{s|$USER|~|:#{=/-32/...:#{b:pane_current_path}}}"

# window current format
set -g @catppuccin_window_current_number "#I"
set -g @catppuccin_window_current_text "#{s|$HOME|~|:#{=/-32/...:#{pane_current_path}}}"

# status modules
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator "█"
# v2's replacement for @catppuccin_status_fill "icon": the icon keeps the module
# colour and the text block sits on surface_1.
set -g @catppuccin_status_module_text_bg "#{@thm_surface_1}"

# v2 changed two module colours; keep the previous palette
set -g @catppuccin_application_color "#{@thm_pink}"
set -g @catppuccin_date_time_color "#{@thm_blue}"

# run catppuccin theme
run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'

# v1 set these; v2 does not, and tmux's own defaults (10 and 40) truncate the
# modules below. Must come after the run.
set -g status-left-length 100
set -g status-right-length 100

# v2 recolours window activity to lavender; keep it yellow as before
set -gF window-status-activity-style "bg=#{@thm_yellow},fg=#{@thm_crust}"

set -g  status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_user}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
